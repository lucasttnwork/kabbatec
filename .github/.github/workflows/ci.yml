name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main, feature/*]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        working-directory: ./bmad
        run: pnpm install --frozen-lockfile || pnpm install

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        working-directory: ./bmad
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run linting
        working-directory: ./bmad
        run: pnpm -w run lint -- --max-warnings=0

      - name: Run security audit
        working-directory: ./bmad
        run: pnpm audit --audit-level=high || echo "Audit reported issues"

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        working-directory: ./bmad
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Generate Prisma Client
        working-directory: ./bmad
        run: pnpm --filter @bmad/prisma run prisma:generate

      - name: Run type checking
        working-directory: ./bmad
        run: pnpm -w run type-check

  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        working-directory: ./bmad
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Generate Prisma Client
        working-directory: ./bmad
        run: pnpm --filter @bmad/prisma run prisma:generate

      - name: Build packages
        working-directory: ./bmad
        run: pnpm -w run build

  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: bmad
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        working-directory: ./bmad
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Generate Prisma Client
        working-directory: ./bmad
        run: pnpm --filter @bmad/prisma run prisma:generate

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            nc -z localhost 5432 && echo "Postgres up" && break
            sleep 2
          done

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/bmad?schema=public" >> $GITHUB_ENV

      - name: Run Prisma migrate (dev)
        working-directory: ./bmad
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @bmad/prisma run prisma:migrate:dev

      - name: Seed database
        working-directory: ./bmad
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm -w run seed

      - name: Run tests with coverage
        working-directory: ./bmad
        run: pnpm -w run test -- --coverage || echo "No tests found or tests failed"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/coverage/lcov.info
            **/coverage/lcov-report
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: **/junit.xml
          retention-days: 7


